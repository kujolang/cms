name: CMS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  stage1-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install CI tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install Kujo runtime
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/kujolang/kujo/releases/download/v1.2.0/kujo-v1.2.0-linux-x64.tar.gz
          curl -fsSLO https://github.com/kujolang/kujo/releases/download/v1.2.0/kujo-v1.2.0-linux-x64.tar.gz.sha256
          sha256sum --check kujo-v1.2.0-linux-x64.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/kujo-bin"
          tar -xzf kujo-v1.2.0-linux-x64.tar.gz -C "$RUNNER_TEMP/kujo-bin"
          chmod +x "$RUNNER_TEMP/kujo-bin/kujo"
          echo "$RUNNER_TEMP/kujo-bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Resolve Kujo runtime
        id: kujo
        shell: bash
        run: |
          set -euo pipefail
          if command -v kujo >/dev/null 2>&1; then
            echo "path=$(command -v kujo)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -d ../kujo && -f ../kujo/Cargo.toml ]]; then
            cargo build --manifest-path ../kujo/Cargo.toml --bin kujo
            echo "path=$(realpath ../kujo/target/debug/kujo)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Unable to locate Kujo runtime binary. Provide it in PATH as 'kujo' or include a sibling ../kujo workspace with Cargo.toml."
          exit 1

      - name: Contract tests
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.kujo.outputs.path }}" test-run tests/cms_contract_tests.kujo

      - name: Stage 1 integration harness
        shell: bash
        run: |
          set -euo pipefail
          KUJO_BIN="${{ steps.kujo.outputs.path }}" CMS_TEST_PORT=4290 bash scripts/integration-stage1.sh

  release-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install CI tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install Kujo runtime
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/kujolang/kujo/releases/download/v1.2.0/kujo-v1.2.0-linux-x64.tar.gz
          curl -fsSLO https://github.com/kujolang/kujo/releases/download/v1.2.0/kujo-v1.2.0-linux-x64.tar.gz.sha256
          sha256sum --check kujo-v1.2.0-linux-x64.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/kujo-bin"
          tar -xzf kujo-v1.2.0-linux-x64.tar.gz -C "$RUNNER_TEMP/kujo-bin"
          chmod +x "$RUNNER_TEMP/kujo-bin/kujo"
          echo "$RUNNER_TEMP/kujo-bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Resolve Kujo runtime
        id: kujo
        shell: bash
        run: |
          set -euo pipefail
          if command -v kujo >/dev/null 2>&1; then
            echo "path=$(command -v kujo)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -d ../kujo && -f ../kujo/Cargo.toml ]]; then
            cargo build --manifest-path ../kujo/Cargo.toml --bin kujo
            echo "path=$(realpath ../kujo/target/debug/kujo)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Unable to locate Kujo runtime binary. Provide it in PATH as 'kujo' or include a sibling ../kujo workspace with Cargo.toml."
          exit 1

      - name: Full release gate
        shell: bash
        run: |
          set -euo pipefail
          CMS_GATE_RUN_PERF=true CMS_GATE_PERF_RUNS=5 CMS_GATE_RUN_PERF_BUDGET=true KUJO_BIN="${{ steps.kujo.outputs.path }}" bash scripts/run-release-gate.sh
