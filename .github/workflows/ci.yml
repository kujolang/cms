name: CMS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  stage1-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install CI tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install Kujo runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/kujolang/kujo/releases/download/v1.2.0/kujo-v1.2.0-linux-x64.tar.gz
          echo "3f9d69779fef64c8f329c69301ac666cf74499ff083f1a5f25f729368b318fcb  kujo-v1.2.0-linux-x64.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/kujo-bin"
          tar -xzf kujo-v1.2.0-linux-x64.tar.gz -C "$RUNNER_TEMP/kujo-bin"
          chmod +x "$RUNNER_TEMP/kujo-bin/kujo"
          "$RUNNER_TEMP/kujo-bin/kujo" --version
          echo "$RUNNER_TEMP/kujo-bin" >> "$GITHUB_PATH"

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          kennel_dir="$RUNNER_TEMP/kennel"
          git clone --filter=blob:none https://github.com/kujolang/kennel.git "$kennel_dir"
          git -C "$kennel_dir" checkout --detach b5e0cf290aa2af7a90b637a7c3bdb4324ea4f66d
          test "$(git -C "$kennel_dir" rev-parse HEAD)" = "b5e0cf290aa2af7a90b637a7c3bdb4324ea4f66d"
          "$RUNNER_TEMP/kujo-bin/kujo" run "$kennel_dir/kennel.kujo" --interpreter -- validate --project-dir "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/kujo-bin/kujo" run "$kennel_dir/kennel.kujo" --interpreter -- install --project-dir "$GITHUB_WORKSPACE"
          test -f kennel_packages/ability/ability.kujo

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Resolve Kujo runtime
        id: kujo
        shell: bash
        run: |
          set -euo pipefail
          kujo_path="$RUNNER_TEMP/kujo-bin/kujo"
          test -x "$kujo_path"
          echo "path=$kujo_path" >> "$GITHUB_OUTPUT"

      - name: Contract tests
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.kujo.outputs.path }}" test-run tests/cms_contract_tests.kujo

      - name: Stage 1 integration harness
        shell: bash
        run: |
          set -euo pipefail
          KUJO_BIN="${{ steps.kujo.outputs.path }}" CMS_TEST_PORT=4290 bash scripts/integration-stage1.sh

  release-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install CI tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Install Kujo runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/kujolang/kujo/releases/download/v1.2.0/kujo-v1.2.0-linux-x64.tar.gz
          echo "3f9d69779fef64c8f329c69301ac666cf74499ff083f1a5f25f729368b318fcb  kujo-v1.2.0-linux-x64.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/kujo-bin"
          tar -xzf kujo-v1.2.0-linux-x64.tar.gz -C "$RUNNER_TEMP/kujo-bin"
          chmod +x "$RUNNER_TEMP/kujo-bin/kujo"
          "$RUNNER_TEMP/kujo-bin/kujo" --version
          echo "$RUNNER_TEMP/kujo-bin" >> "$GITHUB_PATH"

      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          kennel_dir="$RUNNER_TEMP/kennel"
          git clone --filter=blob:none https://github.com/kujolang/kennel.git "$kennel_dir"
          git -C "$kennel_dir" checkout --detach b5e0cf290aa2af7a90b637a7c3bdb4324ea4f66d
          test "$(git -C "$kennel_dir" rev-parse HEAD)" = "b5e0cf290aa2af7a90b637a7c3bdb4324ea4f66d"
          "$RUNNER_TEMP/kujo-bin/kujo" run "$kennel_dir/kennel.kujo" --interpreter -- validate --project-dir "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/kujo-bin/kujo" run "$kennel_dir/kennel.kujo" --interpreter -- install --project-dir "$GITHUB_WORKSPACE"
          test -f kennel_packages/ability/ability.kujo

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Resolve Kujo runtime
        id: kujo
        shell: bash
        run: |
          set -euo pipefail
          kujo_path="$RUNNER_TEMP/kujo-bin/kujo"
          test -x "$kujo_path"
          echo "path=$kujo_path" >> "$GITHUB_OUTPUT"

      - name: Full release gate
        shell: bash
        run: |
          set -euo pipefail
          CMS_GATE_RUN_PERF=true CMS_GATE_PERF_RUNS=5 CMS_GATE_RUN_PERF_BUDGET=true KUJO_BIN="${{ steps.kujo.outputs.path }}" bash scripts/run-release-gate.sh
